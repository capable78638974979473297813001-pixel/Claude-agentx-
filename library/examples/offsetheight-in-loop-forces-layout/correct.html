<div id="list"></div>
<script>
  const list = document.getElementById("list");
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 80; i++) {
    const el = document.createElement("div");
    el.textContent = "item-" + i;
    frag.appendChild(el);
  }
  list.appendChild(frag);
  window.__reads = list.offsetHeight;
</script>
